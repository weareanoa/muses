<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect x="0" y="0" width="1200" height="800" fill="#FCFAF5"/>
  <rect x="28" y="28" width="1144" height="744" rx="24" fill="none" stroke="#C9971C" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="720" rx="18" fill="none" stroke="#C9971C" stroke-opacity="0.15" stroke-width="1"/>

  <defs>
    <linearGradient id="goldGroup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E08F"/>
      <stop offset="50%" stop-color="#C9971C"/>
      <stop offset="100%" stop-color="#7D5C16"/>
    </linearGradient>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF6E7"/>
      <stop offset="100%" stop-color="#F4ECE1"/>
    </linearGradient>
  </defs>

  <ellipse cx="600" cy="430" rx="500" ry="260" fill="url(#goldGroup)" opacity="0.08"/>

  <g opacity="0.9">
    <!-- Member 1 (Edge Left - Zia) -->
    <g transform="translate(180, 0)">
      <circle cx="100" cy="300" r="38" fill="url(#goldGroup)" opacity="0.75"/>
      <rect x="58" y="348" width="84" height="230" rx="42" fill="url(#goldGroup)" opacity="0.5"/>
    </g>
    <!-- Member 2 (Mid Left - Maya) -->
    <g transform="translate(280, 0)">
      <circle cx="110" cy="275" r="40" fill="url(#goldGroup)" opacity="0.8"/>
      <rect x="66" y="325" width="88" height="255" rx="44" fill="url(#goldGroup)" opacity="0.6"/>
    </g>
    <!-- Member 3 (Inner Left - Clara) -->
    <g transform="translate(390, 0)">
      <circle cx="115" cy="255" r="42" fill="url(#goldGroup)" opacity="0.85"/>
      <rect x="69" y="307" width="92" height="275" rx="46" fill="url(#goldGroup)" opacity="0.7"/>
    </g>
    <!-- Member 4 (Center Leader - Aria) -->
    <g transform="translate(500, 0)">
      <circle cx="100" cy="235" r="45" fill="url(#goldGroup)" opacity="0.95"/>
      <rect x="52" y="290" width="96" height="295" rx="48" fill="url(#goldGroup)" opacity="0.8"/>
    </g>
    <!-- Member 5 (Inner Right - Luna) -->
    <g transform="translate(610, 0)">
      <circle cx="85" cy="255" r="42" fill="url(#goldGroup)" opacity="0.85"/>
      <rect x="39" y="307" width="92" height="275" rx="46" fill="url(#goldGroup)" opacity="0.7"/>
    </g>
    <!-- Member 6 (Mid Right - Stella) -->
    <g transform="translate(720, 0)">
      <circle cx="90" cy="275" r="40" fill="url(#goldGroup)" opacity="0.8"/>
      <rect x="46" y="325" width="88" height="255" rx="44" fill="url(#goldGroup)" opacity="0.6"/>
    </g>
    <!-- Member 7 (Edge Right - Reva) -->
    <g transform="translate(820, 0)">
      <circle cx="100" cy="300" r="38" fill="url(#goldGroup)" opacity="0.75"/>
      <rect x="58" y="348" width="84" height="230" rx="42" fill="url(#goldGroup)" opacity="0.5"/>
    </g>
  </g>

  <text x="600" y="690" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="16" letter-spacing="12" fill="#9A7420">OFFICIAL PROFILE GROUP VISUAL</text>
  <text x="600" y="735" text-anchor="middle" font-family="'Poppins', 'Inter', sans-serif" font-size="38" font-weight="900" letter-spacing="14" fill="#1F1A12">MUSES</text>
</svg>