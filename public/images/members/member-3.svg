<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F7ECE0"/>
    </linearGradient>
    <linearGradient id="goldStella" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAD089"/>
      <stop offset="50%" stop-color="#C98A2C"/>
      <stop offset="100%" stop-color="#7C4A10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="1000" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="952" rx="20" fill="none" stroke="#C98A2C" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="36" y="36" width="728" height="928" rx="16" fill="none" stroke="#C98A2C" stroke-opacity="0.2" stroke-width="1"/>

  <circle cx="400" cy="400" r="230" fill="url(#goldStella)" opacity="0.12" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="170" fill="url(#goldStella)" opacity="0.9"/>
  <circle cx="400" cy="400" r="140" fill="#FCFAF5" opacity="0.25"/>

  <path d="M140 1000 C160 680 290 590 400 590 C510 590 640 680 660 1000 Z" fill="url(#goldStella)" opacity="0.85"/>
  <path d="M260 380 Q400 230 540 380" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.5"/>

  <g transform="translate(400, 260) scale(1.6)" fill="#FFFFFF" opacity="0.95">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-size="28" font-family="'Segoe UI Symbol', sans-serif">✧</text>
  </g>

  <text x="400" y="800" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="14" letter-spacing="10" fill="#B8860B">MUSES DANCING FLAME</text>
  <text x="400" y="845" text-anchor="middle" font-family="'Poppins', 'Inter', sans-serif" font-size="34" font-weight="900" letter-spacing="6" fill="#1F1A12">STELLA</text>
  <text x="400" y="885" text-anchor="middle" font-family="'Poppins', 'Inter', sans-serif" font-size="13" font-weight="500" letter-spacing="4" fill="#6E6453">MAIN DANCER • LEAD RAPPER • ✧</text>
</svg>